<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="House Bar">
<meta name="theme-color" content="#f3efe7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>House Bar</title>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500&amp;display=swap">
<style id="app-css">
/* Layout idea: cute Japandi. Dotted washi paper, rounded type, pastel tiles tinted by each drink; every glass is a little character with a face and its own props.  Rice-paper ground, ink text, oak and sage accents, hairline rules and generous space. An ink ensō and a small red seal mark the bar; every drink sits beside a soft illustration of its glass. */
:root{
  --paper:#f3efe7;
  --paper-2:#ebe5da;
  --ink:#2a2723;
  --ink-soft:#6c655c;
  --line:rgba(42,39,35,.14);
  --oak:#9c7a54;
  --sage:#76826b;
  --seal:#b3473a;
  --display:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  --blush:#f2b3ad;
  --matcha:#b4c497;
  --body:"Zen Kaku Gothic New", "Hiragino Sans", "Helvetica Neue", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--paper);background-image:radial-gradient(rgba(156,122,84,.10) 1px, transparent 1.3px);background-size:20px 20px;color:var(--ink);font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.sheet-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oak);outline-offset:3px}

.shell{max-width:1220px;margin:0 auto;padding:36px clamp(18px,4.5vw,64px) 72px}

/* Header */
.mast{position:relative;display:flex;align-items:center;gap:28px;padding:6px 0 30px}
.enso{width:118px;height:118px;flex-shrink:0;color:var(--ink)}
.enso .mascot{transform-origin:60px 96px;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.mast-text{min-width:0;padding-right:150px}

.bar-name{font-family:var(--display);font-weight:700;font-size:clamp(40px,5.6vw,66px);line-height:1.05;margin:0;letter-spacing:.01em;display:flex;align-items:center;gap:16px;flex-wrap:wrap;text-wrap:balance}
.seal{display:inline-grid;place-items:center;width:38px;height:38px;background:var(--seal);color:#f7efe6;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:21px;border-radius:12px;line-height:1;transform:rotate(-6deg);box-shadow:2px 3px 0 rgba(42,39,35,.12)}
.tagline{margin:12px 0 0;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--oak);font-weight:400}
.dateline{margin:6px 0 0;font-size:15px;color:var(--ink-soft);letter-spacing:.04em}
.key{position:absolute;top:0;right:0;width:52px;height:52px;border-radius:50%;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink-soft);opacity:.5;touch-action:none;-webkit-user-select:none;user-select:none}
.key svg{width:22px;height:22px}
.key::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid var(--oak);clip-path:inset(0 100% 0 0);opacity:0}
.key.holding{opacity:1}
.key.holding::after{opacity:1;animation:fill .9s linear forwards}
.key.on{opacity:1;border-color:var(--line);background:var(--paper-2)}
@keyframes fill{to{clip-path:inset(0 0 0 0)}}

/* Section nav */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 40px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 18px 9px;font-size:14px;letter-spacing:.06em;color:var(--ink-soft);min-height:44px}
.chip{background:rgba(255,255,255,.5)}
.chip[aria-pressed="true"]{background:var(--matcha);border-color:var(--matcha);color:var(--ink);font-weight:500}

/* Sections */
.section{margin:0 0 52px}
.section-head{display:flex;align-items:baseline;gap:16px;margin:0 0 4px}
.section-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em}
.section-head .note{font-size:13px;letter-spacing:.08em;color:var(--sage)}
.section-head::after{content:"";flex:1;height:8px;align-self:center;background:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724%27 height=%278%27%3E%3Cpath d=%27M0 4 Q6 0 12 4 T24 4%27 fill=%27none%27 stroke=%27%2376826b%27 stroke-opacity=%27.45%27 stroke-width=%271.4%27/%3E%3C/svg%3E") repeat-x center}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));column-gap:56px}

.drink{display:grid;grid-template-columns:108px 1fr;gap:18px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:22px 0 20px;border-radius:0}
.drink:active{background:rgba(156,122,84,.07)}
.art-tile{width:108px;height:136px;background:var(--paper-2);border-radius:20px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.art-tile svg{transform-origin:50% 90%}
.drink:active .art-tile svg,.drink:hover .art-tile svg{animation:wiggle .6s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}55%{transform:rotate(5deg)}80%{transform:rotate(-2deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
.art-tile svg{width:106px;height:138px;display:block}
.line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.name{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.4vw,26px);line-height:1.2}
.tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:4px 8px 3px;border-radius:2px;font-weight:500;white-space:nowrap}
.tag{border-radius:999px;padding:4px 10px 3px}
.tag.pick{background:var(--blush);color:#7a2e2a}
.tag.stock{border:1px solid var(--sage);color:var(--sage)}
.jname{display:block;margin-top:2px;font-size:13.5px;color:var(--ink-soft);letter-spacing:.04em}
.d-alt{margin:-6px 0 14px;font-size:17px;color:var(--ink-soft)}
.lang{position:absolute;top:6px;right:62px;border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:999px;padding:9px 16px 8px;font-size:14px;color:var(--ink);min-height:44px;letter-spacing:.04em}
html[lang="ja"] .tagline,html[lang="ja"] .ings,html[lang="ja"] .cue,html[lang="ja"] .tag,html[lang="ja"] .eyebrow,html[lang="ja"] .d-h,html[lang="ja"] .fact dt,html[lang="ja"] .spec li.grp{letter-spacing:.06em}
.meta{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--ink-soft);font-size:13px;letter-spacing:.06em}
.desc{margin:8px 0 0;font-size:16px;line-height:1.55;color:var(--ink);max-width:52ch}
.ings{margin:8px 0 0;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);line-height:1.7}
.cue{display:inline-block;margin-top:10px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--oak);font-weight:500}

.strength{display:inline-flex;gap:4px;align-items:center}
.strength svg{width:11px;height:10px;display:block}
.zero{font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--matcha);color:var(--ink);padding:3px 8px 2px;border-radius:999px}

/* Manage mode */
.manage-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:12px 16px;margin:0 0 22px;background:var(--paper-2);border:1px solid var(--line);border-radius:6px}
.manage-bar p{margin:0;font-size:15px;color:var(--ink-soft)}
.manage-bar strong{color:var(--ink);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-right:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:11px 18px 10px;border-radius:999px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;min-height:44px}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--seal);color:var(--seal)}
.btn.danger.armed{background:var(--seal);color:#fff}
.row-tools{display:flex;align-items:center;gap:12px;padding:10px 0 0 126px}
.switch{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);min-height:44px}
.switch .track{width:44px;height:26px;border-radius:13px;background:var(--paper-2);border:1px solid var(--line);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink-soft);transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--sage);border-color:var(--sage)}
.switch[aria-checked="true"] .track::after{transform:translateX(18px);background:var(--paper)}
.drink-wrap{border-bottom:1px solid var(--line)}
.drink-wrap .drink{border-bottom:0}
.drink-wrap.manage{padding-bottom:10px}
.drink-wrap.off .name,.drink-wrap.off .desc{color:#a39a8f}
.drink-wrap.off .name{text-decoration:line-through;text-decoration-thickness:1px}
.drink-wrap.off .art-tile{opacity:.45}

.foot{margin-top:28px;text-align:center;color:var(--ink-soft);font-size:14px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:10px}
.foot .kanpai{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);letter-spacing:.04em}
.foot .kanpai svg{width:64px;height:48px}
.empty{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:17px}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(42,39,35,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s ease-out}
.sheet{position:relative;width:min(900px,100%);max-height:92%;overflow:auto;background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:36px clamp(20px,4vw,52px) 44px;animation:rise .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 60px rgba(42,39,35,.18)}
@media (min-height:700px) and (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:28px;border-bottom:1px solid var(--line)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet-wrap,.sheet,.tw,.enso .mascot,.facts .art-big svg,.drink:active .art-tile svg,.drink:hover .art-tile svg{animation:none}.key.holding::after{animation-duration:.01s}}
.close{position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:24px;line-height:1}
.eyebrow{margin:0;font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--oak);font-weight:400}
.d-name{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,50px);line-height:1.1;margin:10px 0 12px;text-wrap:balance;padding-right:44px}
.d-desc{font-size:18px;line-height:1.6;margin:0 0 28px;max-width:58ch}
.d-grid{display:grid;grid-template-columns:220px 1fr;gap:40px}
@media (max-width:640px){.d-grid{grid-template-columns:1fr}}
.facts{display:flex;flex-direction:column;gap:18px}
.facts .art-big{background:var(--paper-2);border-radius:28px;display:grid;place-items:center;padding:14px 0}
.facts .art-big svg{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.facts .art-big svg{width:190px;height:247px}
@media (max-width:640px){.facts{flex-direction:row;flex-wrap:wrap}.facts .art-big svg{width:130px;height:169px}}
.fact dt{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--oak)}
.fact dd{margin:4px 0 0;font-size:16px;line-height:1.45}
.facts dl{margin:0;display:flex;flex-direction:column;gap:14px}
.d-h{margin:0 0 10px;font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--oak);font-weight:500}
.spec{list-style:none;margin:0 0 30px;padding:0}
.spec li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:11px 0 10px;border-bottom:1px solid var(--line);font-size:17px}
.spec li.grp{display:block;border-bottom:0;padding:18px 0 2px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage);font-weight:500}
.spec li.grp:first-child{padding-top:0}
.spec .q{font-variant-numeric:tabular-nums;color:var(--oak);font-weight:400;text-align:right}
.steps{margin:0;padding-left:24px;font-size:16.5px;line-height:1.6}
.steps li{padding-left:6px;margin-bottom:7px}
.steps li::marker{font-family:var(--display);color:var(--oak)}

/* Forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.field label{display:block;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--oak);margin-bottom:7px}
.field input[type=text],.field select,.field textarea{width:100%;background:#fbf9f5;border:1px solid var(--line);border-radius:4px;padding:12px 12px 10px;font-size:17px;font-weight:300}
.field input[type=color]{width:64px;height:44px;border:1px solid var(--line);border-radius:4px;background:#fbf9f5;padding:3px}
.field textarea{resize:vertical;line-height:1.5}
.field .hint{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.45}
.field input[type=range]{width:100%;accent-color:var(--oak)}
.checks{display:flex;gap:24px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;font-size:16px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--sage)}
.form-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:28px}
.form-actions .btns{margin-left:auto}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);padding:12px 20px 11px;border-radius:999px;font-size:14px;letter-spacing:.04em;box-shadow:0 8px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (max-width:560px){.mast{gap:16px}.enso{width:72px;height:72px}.seal{width:30px;height:30px;font-size:17px}.drink{grid-template-columns:72px 1fr;gap:14px}.art-tile{width:72px;height:94px}.art-tile svg{width:70px;height:91px}.row-tools{padding-left:86px}}
.search{position:relative;display:flex;align-items:center;margin:-22px 0 34px}
.search svg{position:absolute;left:18px;width:20px;height:20px;color:var(--ink-soft);pointer-events:none}
.search input{width:100%;min-height:52px;padding:12px 52px 11px 50px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.65);font-size:17px;font-weight:300;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#a39a8f}
.search input:focus{outline:none;border-color:var(--matcha);box-shadow:0 0 0 3px rgba(180,196,151,.35)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clear{position:absolute;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--paper-2);color:var(--ink);font-size:20px;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Narrow screens: put the language and key buttons in a row above the title */
@media (max-width:560px){.mast{padding-top:60px}.mast-text{padding-right:0}.mast .lang{top:6px;bottom:auto;right:60px}.mast .key{top:2px}}
</style>
</head>

<div id="app"></div>
<div id="sheet"></div>

        '<div class="field"><label for="f-jname">Japanese name</label><input type="text" id="f-jname" name="jname" value="' + esc(d.ja && d.ja.name) + '"></div>' +
        '<div class="field"><label for="f-jdesc">Japanese description</label><input type="text" id="f-jdesc" name="jdesc" value="' + esc(d.ja && d.ja.description) + '"><div class="hint">If you change the English ingredients or steps, the Japanese recipe shows English until it\u2019s re-translated.</div></div>' +
        '<div class="field full"><label for="f-ings">Ingredients</label><textarea id="f-ings" name="ingredients" rows="6" placeholder="2 oz | Vodka">' + esc(ingText) + '</textarea><div class="hint">One per line. Amount, then a | bar, then the ingredient. E.g. “1 oz | Fresh lemon juice” or “Top | Tonic water”. Start a line with # for a group heading, like “# In the shaker”.</div></div>' +
        '<div class="field full"><label for="f-steps">Method steps</label><textarea id="f-steps" name="steps" rows="4">' + esc((d.steps || []).join("\n")) + '</textarea><div class="hint">One step per line.</div></div>' +
        '<div class="field"><label for="f-glass">Glass</label><select id="f-glass" name="glass">' + glassOpts + '</select></div>' +
        '<div class="field"><label for="f-color">Drink colour</label><input type="color" id="f-color" name="color" value="' + esc(color) + '"><div class="hint">Used for the illustration.</div></div>' +
        '<div class="field"><label for="f-tech">Technique</label><input type="text" id="f-tech" name="technique" list="tech-list" value="' + esc(d.technique) + '"><datalist id="tech-list"><option value="Shaken"><option value="Stirred"><option value="Built"><option value="Shaken & topped"><option value="Blended"><option value="Layered"></datalist></div>' +
        '<div class="field"><label for="f-garnish">Garnish</label><input type="text" id="f-garnish" name="garnish" value="' + esc(d.garnish) + '"></div>' +
        '<div class="field full"><label for="f-strength">Strength: <span id="f-strength-word">' + esc(STRENGTH_WORDS[Number(d.strength) || 0]) + '</span></label><input type="range" id="f-strength" name="strength" min="0" max="5" step="1" value="' + (Number(d.strength) || 0) + '"></div>' +
        '<div class="field full checks">' +
          '<label class="check" for="f-avail"><input type="checkbox" id="f-avail" name="available"' + (d.available !== false ? " checked" : "") + '> On the menu tonight</label>' +
          '<label class="check" for="f-special"><input type="checkbox" id="f-special" name="special"' + (d.special ? " checked" : "") + '> Only when stocked</label>' +
          '<label class="check" for="f-fav"><input type="checkbox" id="f-fav" name="favourite"' + (d.favourite ? " checked" : "") + '> House pick</label>' +
        '</div>' +
        '<div class="form-actions full">' +
          (isNew ? '' : '<button class="btn danger" type="button" data-action="delete" data-id="' + esc(d.id) + '">Delete drink</button>') +
          '<div class="btns"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn solid" type="submit">' + (isNew ? "Add drink" : "Save changes") + '</button></div>' +
        '</div>' +
      '</form>';
    openSheet(inner, isNew ? "Add a drink" : "Edit " + d.name);
    $("#f-name").focus({ preventScroll: true });
  }

  function showSettings(){
    var inner = '<p class="eyebrow">Your bar</p><h2 class="d-name">Name &amp; details</h2>' +
      '<form id="settings-form" class="form" autocomplete="off">' +
        '<div class="field full"><label for="s-name">Bar name</label><input type="text" id="s-name" name="barName" value="' + esc(state.barName) + '"></div>' +
        '<div class="field full"><label for="s-tag">Line under the name</label><input type="text" id="s-tag" name="tagline" value="' + esc(state.tagline) + '"></div>' +
        '<div class="field full"><label for="s-foot">Footer note</label><input type="text" id="s-foot" name="footer" value="' + esc(state.footer) + '"></div>' +
        '<div class="form-actions full"><div class="btns"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn solid" type="submit">Save</button></div></div>' +
      '</form>';
    openSheet(inner, "Bar name and details");
  }

  function parseIngredients(text){
    return String(text || "").split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
      if (l.charAt(0) === "#") return { h: l.replace(/^#+\s*/, "") };
      var i = l.indexOf("|");
      return i >= 0 ? { q: l.slice(0, i).trim(), i: l.slice(i + 1).trim() } : { q: "", i: l };
    });
  }

  // ---------- Saving ----------
  function toast(msg){
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  function buildDocument(){
    var css = document.getElementById("app-css").textContent;
    var js = document.getElementById("app-js").textContent;
    var font = (document.getElementById("font-link").getAttribute("href") || "").replace(/&/g, "&amp;");
    var data = JSON.stringify(state).replace(/</g, "\\u003c");
    var S = "script";
    return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>House Cocktail Menu</title>\n" +
      "<link id=\"font-link\" rel=\"stylesheet\" href=\"" + font + "\">\n" +
      "<style id=\"app-css\">" + css + "</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<div id=\"sheet\"></div>\n<div id=\"toast\" class=\"toast\" role=\"status\" aria-live=\"polite\"></div>\n" +
      "<" + S + " id=\"menu-data\" type=\"application/json\">" + data + "</" + S + ">\n" +
      "<" + S + " id=\"app-js\">" + js + "</" + S + ">\n</body>\n</html>\n";
  }

  function commit(){
    state.updatedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    render();
    clearTimeout(pubTimer);
    pubTimer = setTimeout(publishNow, 1200);
  }

  function publishNow(){
    if (!artifactNS || !canPublish) { toast(window.HOUSE_BAR_NATIVE ? "Saved" : "Saved on this device"); return; }
    var p;
    try { p = artifactNS.publish(buildDocument()); } catch (e) { p = Promise.reject(e); }
    Promise.resolve(p).then(function(){ toast("Menu saved"); }).catch(function(e){
      var code = String((e && (e.code || e.name || e.message)) || "");
      if (/conflict/i.test(code)) return;
      if (/not_granted|not_writer/i.test(code)) { canPublish = false; toast("Saved on this device only"); return; }
      toast("Saved on this device. The shared menu link didn’t update.");
    });
  }

  // ---------- Events ----------
  document.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-action]");
    if (!el) return;
    var a = el.getAttribute("data-action"), id = el.getAttribute("data-id");
    if (a === "backdrop") { if (ev.target === el) closeSheet(); return; }
    if (a === "close") { closeSheet(); return; }
    if (a === "open") { showDetail(id); return; }
    if (a === "lang") { ui.lang = isJa() ? "en" : "ja"; try { localStorage.setItem(LANG_KEY, ui.lang); } catch (e) {} render(); return; }
    if (a === "filter") { ui.filter = el.getAttribute("data-value"); ui.q = ""; render(); return; }
    if (a === "clear-q") { ui.q = ""; var qi = $("#q"); if (qi) { qi.value = ""; qi.focus(); } refreshResults(); return; }
    if (a === "edit") { showEditor(id); return; }
    if (a === "new") { showEditor(null); return; }
    if (a === "settings") { showSettings(); return; }
    if (a === "backup") {
      var json = JSON.stringify(state);
      try { navigator.clipboard.writeText(json).then(function(){ toast("Menu copied. Paste it to Claude to keep it safe."); }, function(){ toast("Couldn’t copy the backup on this device."); }); }
      catch (e) { toast("Couldn’t copy the backup on this device."); }
      return;
    }
    if (a === "done") { ui.manage = false; render(); return; }
    if (a === "toggle") { var d = findDrink(id); if (d) { d.available = d.available === false; commit(); } return; }
    if (a === "delete") {
      if (!el.classList.contains("armed")) { el.classList.add("armed"); el.textContent = "Tap again to delete"; return; }
      state.drinks = state.drinks.filter(function(x){ return x.id !== id; });
      closeSheet(); commit(); return;
    }
  });

  document.addEventListener("submit", function(ev){
    ev.preventDefault();
    var f = ev.target;
    if (f.id === "drink-form") {
      var name = f.elements.name.value.trim();
      if (!name) { f.elements.name.focus(); return; }
      var id = f.getAttribute("data-id");
      var d = id ? findDrink(id) : null;
      if (!d) { d = { id: "d" + Date.now().toString(36), look: {} }; state.drinks.push(d); }
      var oldIngs = JSON.stringify(d.ingredients || []), oldSteps = JSON.stringify(d.steps || []), oldGarn = d.garnish;
      d.name = name;
      d.category = f.elements.category.value.trim() || "Martinis";
      if (state.categories.indexOf(d.category) < 0) state.categories.push(d.category);
      d.spirit = f.elements.spirit.value.trim();
      d.description = f.elements.description.value.trim();
      d.ingredients = parseIngredients(f.elements.ingredients.value);
      d.steps = f.elements.steps.value.split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
      d.glass = f.elements.glass.value;
      d.look = d.look || {}; d.look.c = safeColor(f.elements.color.value, "#c8a36a");
      d.technique = f.elements.technique.value.trim();
      d.garnish = f.elements.garnish.value.trim();
      d.strength = Number(f.elements.strength.value) || 0;
      d.available = f.elements.available.checked;
      d.special = f.elements.special.checked;
      d.favourite = f.elements.favourite.checked;
      d.ja = d.ja || {};
      d.ja.name = f.elements.jname.value.trim();
      d.ja.description = f.elements.jdesc.value.trim();
      if (JSON.stringify(d.ingredients) !== oldIngs) delete d.ja.ingredients;
      if (JSON.stringify(d.steps) !== oldSteps) delete d.ja.steps;
      if (d.garnish !== oldGarn) delete d.ja.garnish;
      closeSheet(); commit();
    } else if (f.id === "settings-form") {
      state.barName = f.elements.barName.value.trim() || "The House Bar";
      state.tagline = f.elements.tagline.value.trim();
      state.footer = f.elements.footer.value.trim();
      closeSheet(); commit();
    }
  });

  document.addEventListener("input", function(ev){
    if (ev.target.id === "q") { ui.q = ev.target.value; refreshResults(); return; }
    if (ev.target.id === "f-strength") { var w = $("#f-strength-word"); if (w) w.textContent = STRENGTH_WORDS[Number(ev.target.value) || 0]; }
  });
  document.addEventListener("keydown", function(ev){
    if (ev.target && ev.target.id === "q" && ev.key === "Enter") { ev.preventDefault(); ev.target.blur(); return; }
    if (ev.key === "Escape" && $("#sheet").innerHTML) closeSheet();
  });

  // Press and hold the key to manage (keeps guests from editing by accident)
  var holdTimer = null, holdEl = null, held = false;
  function endHold(){ clearTimeout(holdTimer); if (holdEl) holdEl.classList.remove("holding"); holdEl = null; }
  document.addEventListener("pointerdown", function(ev){
    var k = ev.target.closest("[data-hold]"); if (!k) return;
    held = false;
    if (ui.manage) return;
    holdEl = k; k.classList.add("holding");
    holdTimer = setTimeout(function(){ held = true; endHold(); ui.manage = true; render(); toast("Managing the menu"); }, 900);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function(t){ document.addEventListener(t, function(){ if (holdEl) endHold(); }, true); });
  document.addEventListener("click", function(ev){
    var k = ev.target.closest("[data-hold]"); if (!k) return;
    if (held) { held = false; return; }
    if (ui.manage) { ui.manage = false; render(); }
    else toast("Press and hold the key to manage the menu");
  });
  document.addEventListener("keydown", function(ev){
    var k = ev.target.closest && ev.target.closest("[data-hold]");
    if (k && (ev.key === "Enter" || ev.key === " ") && !ui.manage) { ev.preventDefault(); ui.manage = true; render(); }
  });
  document.addEventListener("contextmenu", function(ev){ if (ev.target.closest("[data-hold]")) ev.preventDefault(); });

  // ---------- Boot ----------
  function start(snap){
    if (snap && typeof snap === "object") { ui.manage = !!snap.manage; if (snap.filter) ui.filter = snap.filter; if (snap.lang) ui.lang = snap.lang; }
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") { try { hot.snapshot(function(){ return { manage: ui.manage, filter: ui.filter, lang: ui.lang }; }); } catch (e) {} }
  if (hot && typeof hot.ready === "function") hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
<script>
(function(){
  if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
  var lock = null;
  function wake(){ try { if (navigator.wakeLock && !lock) navigator.wakeLock.request("screen").then(function(l){ lock = l; l.addEventListener("release", function(){ lock = null; }); }).catch(function(){}); } catch (e) {} }
  document.addEventListener("click", wake, { once: true });
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") wake(); });
})();
</script>
</body>
</html>
